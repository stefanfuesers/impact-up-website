<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Conexiones que cruzan</title>
  <desc id="beschreibung">Seis circulos representan una parroquia, un club deportivo, un repair cafe, un comite de empresa, un banco de alimentos y los bomberos voluntarios. Lineas doradas curvas los conectan entre si. Debajo corre como base continua la humanidad y la democracia.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Los niveles de acción – y el nivel intercalado</title>
  <desc id="beschreibung">Tres niveles de acción en Ruth Seliger: la persona con la resonancia, la organización con la estructura, la sociedad con la cooperación. Impact Up intercala entre organización y sociedad el nivel de los campos de impacto; los cuatro campos están conectados entre sí.</desc>

  <rect width="880" height="600" fill="#F4ECD8"/>

  <text x="60" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#8A5E3B">NIVELES DE ACCIÓN</text>


  <rect x="60" y="372" width="760" height="88" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
  <text x="88" y="410" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#2D4A2B">Organización</text>
  <text x="792" y="410" text-anchor="end" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#C9A961">Estructura</text>
  <text x="88" y="439" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#1F1A14">construir organizaciones para la transformación</text>

  <rect x="60" y="500" width="760" height="88" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
  <text x="88" y="538" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#2D4A2B">Persona</text>
  <text x="792" y="538" text-anchor="end" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#C9A961">Resonancia</text>
  <text x="88" y="567" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#1F1A14">aprender a pensar sistémicamente</text>

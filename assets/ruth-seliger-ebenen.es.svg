    <path d="M348 202 C 412 186, 512 182, 578 168" stroke-width="0.8" stroke-dasharray="2 2.5" opacity="0.7"/>
  </g>
  <g fill="#C9A961">
    <circle cx="300" cy="478" r="2.8"/><circle cx="437" cy="478" r="2.2"/><circle cx="597" cy="478" r="1.8"/>
    <circle cx="300" cy="350" r="2.8"/><circle cx="437" cy="350" r="2.2"/><circle cx="599" cy="350" r="1.8"/>
    <circle cx="300" cy="184" r="2.8"/><circle cx="437" cy="184" r="2.2"/><circle cx="599" cy="184" r="1.8"/>
  </g>

  <rect x="60" y="74" width="760" height="88" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
  <text x="88" y="112" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#2D4A2B">Sociedad</text>
  <text x="792" y="112" text-anchor="end" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#C9A961">Cooperación</text>
  <text x="88" y="141" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#1F1A14">formar alianzas estratégicas · dar forma a la comunicación y la cooperación</text>

  <rect x="60" y="206" width="760" height="132" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1.6"/>
  <text x="88" y="244" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#F4ECD8">Campos de Impacto</text>
  <text x="792" y="240" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="600" letter-spacing="1.4" fill="#C9A961">INTERCALADO POR IMPACT UP</text>
  <text x="88" y="268" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#F4ECD8">hacer visibles coherencia y complementariedad · acordar en los límites de campo</text>


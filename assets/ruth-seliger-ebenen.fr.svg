<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Les niveaux d'action – et le niveau intercalé</title>
  <desc id="beschreibung">Trois niveaux d'action chez Ruth Seliger : la personne avec la résonance, l'organisation avec la structure, la société avec la coopération. Impact Up intercale entre organisation et société le niveau des champs d'impact ; les quatre champs sont reliés entre eux.</desc>

  <rect width="880" height="600" fill="#F4ECD8"/>

  <text x="60" y="44" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#8A5E3B">NIVEAUX D'ACTION</text>

  <g fill="none" stroke="#C9A961">
    <path d="M300 500 C 286 484, 314 470, 300 456" stroke-width="1.3"/>
    <path d="M444 500 C 428 482, 456 472, 440 456" stroke-width="1.3"/>

    <text x="573" y="307" text-anchor="middle">Démocratie</text>
    <rect x="682" y="284" width="110" height="36" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="0.9"/>
    <text x="737" y="300" text-anchor="middle">Paix &amp;</text>
    <text x="737" y="315" text-anchor="middle">Non-violence</text>
  </g>

  <rect x="60" y="372" width="760" height="88" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
  <text x="88" y="410" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#2D4A2B">Organisation</text>
  <text x="792" y="410" text-anchor="end" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#C9A961">Structure</text>
  <text x="88" y="439" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#1F1A14">construire des organisations pour la transformation</text>

  <rect x="60" y="500" width="760" height="88" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
  <text x="88" y="538" font-family="Cormorant Garamond, Georgia, serif" font-size="26" fill="#2D4A2B">Personne</text>
  <text x="792" y="538" text-anchor="end" font-family="Cormorant Garamond, Georgia, serif" font-size="30" font-weight="600" fill="#C9A961">Résonance</text>
  <text x="88" y="567" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#1F1A14">apprendre à penser de façon systémique</text>
</svg>

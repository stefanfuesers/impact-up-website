<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Die Formel der Energie</title>
  <desc id="beschreibung">Ein Kreislauf mit vier Stationen: von Driver zu Vision, von Vision zu Resources, von Resources zu First Steps und zurück zum Driver. Zwischen den Stationen stehen Malzeichen. Im Zentrum steht die Energie. Im äußeren Kreis liegen die drei Felder Ökonomie, Ökologie und Demokratie.</desc>

  <defs>
    <marker id="pfeil" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#C9A961"/>
    </marker>
  </defs>

  <rect width="880" height="600" fill="#F4ECD8"/>

  <!-- Äußerer Kreis: die drei Felder -->
  <circle cx="440" cy="300" r="265" fill="none" stroke="#C9A961" stroke-width="1" stroke-dasharray="4 4" opacity="0.8"/>

  <!-- Innerer Kreis als Lauf: Driver → Vision → Resources → First Steps → Driver -->
  <g fill="none" stroke="#C9A961" stroke-width="1.6" marker-end="url(#pfeil)">
    <path d="M527.5 148.5 A175 175 0 0 1 609.8 257.7"/>
    <path d="M609.8 342.3 A175 175 0 0 1 527.5 451.5"/>
    <path d="M352.5 451.5 A175 175 0 0 1 270.2 342.3"/>
    <path d="M270.2 257.7 A175 175 0 0 1 352.5 148.5"/>
  </g>

  <!-- Malzeichen zwischen den Elementen -->
  <g stroke="#C9A961" stroke-width="1.8" stroke-linecap="round">
    <path d="M558.7 171.3 L568.7 181.3 M568.7 171.3 L558.7 181.3"/>
    <path d="M558.7 418.7 L568.7 428.7 M568.7 418.7 L558.7 428.7"/>
    <path d="M311.3 418.7 L321.3 428.7 M321.3 418.7 L311.3 428.7"/>
    <path d="M311.3 171.3 L321.3 181.3 M321.3 171.3 L311.3 181.3"/>
  </g>

  <!-- Zentrum: Energie -->
  <circle cx="440" cy="300" r="78" fill="#2D4A2B" stroke="#C9A961" stroke-width="1.8"/>
  <text x="440" y="312" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="34" font-weight="600" fill="#C9A961">Energie</text>

  <!-- Die vier Elemente -->
  <g font-family="Cormorant Garamond, Georgia, serif" font-size="23" fill="#2D4A2B" text-anchor="middle">
    <rect x="365" y="102" width="150" height="46" rx="2" fill="#FAF6EA" stroke="#C9A961" stroke-width="1.2"/>
    <text x="440" y="132">Driver</text>

    <rect x="540" y="277" width="150" height="46" rx="2" fill="#FAF6EA" stroke="#C9A961" stroke-width="1.2"/>
    <text x="615" y="307">Vision</text>

    <rect x="365" y="452" width="150" height="46" rx="2" fill="#FAF6EA" stroke="#C9A961" stroke-width="1.2"/>
    <text x="440" y="482">Resources</text>

    <rect x="190" y="277" width="150" height="46" rx="2" fill="#FAF6EA" stroke="#C9A961" stroke-width="1.2"/>
    <text x="265" y="307">First Steps</text>
  </g>

  <!-- Die drei Felder, außen -->
  <g font-family="Cormorant Garamond, Georgia, serif" font-size="21" fill="#F4ECD8" text-anchor="middle">
    <rect x="375" y="17" width="130" height="38" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1"/>
    <text x="440" y="43">Ökonomie</text>

    <rect x="609" y="414" width="120" height="38" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1"/>
    <text x="669" y="440">Ökologie</text>

    <rect x="146" y="414" width="134" height="38" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1"/>
    <text x="213" y="440">Demokratie</text>
  </g>
</svg>

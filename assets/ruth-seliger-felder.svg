<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 580" role="img" aria-labelledby="titel beschreibung">
  <title id="titel">Drei Problemfelder, vier Wirkungsfelder</title>
  <desc id="beschreibung">Ruth Seligers drei Problemfelder Ökologie, Ökonomie und Demokratie hängen zusammen und entsprechen den Impact-Up-Wirkungsfeldern Ökosystem Erde, Soziale Teilhabe und Demokratie. Frieden und Gewaltfreiheit kommt bei Impact Up als viertes Feld dazu. Die vier Wirkungsfelder sind untereinander vernetzt.</desc>

  <rect width="880" height="580" fill="#F4ECD8"/>

  <!-- Spaltenköpfe -->
  <text x="60" y="46" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#8A5E3B">RUTH SELIGER</text>
  <text x="60" y="74" font-family="Cormorant Garamond, Georgia, serif" font-size="27" fill="#2D4A2B">Drei Problemfelder</text>

  <text x="850" y="46" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="1.6" fill="#8A5E3B">IMPACT UP</text>
  <text x="850" y="74" text-anchor="end" font-family="Cormorant Garamond, Georgia, serif" font-size="27" fill="#2D4A2B">Vier Wirkungsfelder</text>

  <!-- Zusammenhang der drei Felder links -->
  <g fill="none" stroke="#C9A961" stroke-width="1.1" opacity="0.8">
    <path d="M60 182 C 24 212, 24 284, 60 312"/>
    <path d="M60 312 C 26 342, 26 412, 60 442"/>
  </g>

  <!-- Netz zwischen den vier Wirkungsfeldern -->
  <g fill="none" stroke="#C9A961" opacity="0.85">
    <path d="M635 182 C 655 172, 668 192, 690 182" stroke-width="1.2"/>
    <path d="M635 342 C 656 332, 668 352, 690 342" stroke-width="1.2"/>
    <path d="M552 214 C 540 250, 566 278, 552 310" stroke-width="1.2"/>
    <path d="M772 214 C 760 250, 786 278, 772 310" stroke-width="1.2"/>
    <path d="M600 214 C 632 246, 692 282, 730 310" stroke-width="0.9" stroke-dasharray="2 2"/>
    <path d="M724 214 C 692 246, 632 282, 596 310" stroke-width="0.9" stroke-dasharray="2 2"/>
  </g>
  <g fill="#C9A961">
    <circle cx="662" cy="262" r="3.6"/>
    <circle cx="662" cy="182" r="2.6"/>
    <circle cx="662" cy="342" r="2.6"/>
    <circle cx="552" cy="262" r="1.9"/>
    <circle cx="772" cy="262" r="1.9"/>
  </g>

  <!-- Entsprechungen links nach rechts -->
  <g fill="none" stroke="#C9A961" stroke-width="1.4">
    <path d="M280 182 C 340 176, 400 190, 470 182"/>
    <path d="M280 312 C 348 306, 402 336, 470 342"/>
    <path d="M280 442 C 400 472, 566 470, 668 432 C 716 414, 754 396, 772 374"/>
  </g>
  <g fill="#C9A961">
    <circle cx="375" cy="183" r="3.2"/>
    <circle cx="375" cy="321" r="3.2"/>
    <circle cx="470" cy="459" r="3.2"/>
  </g>

  <!-- Das vierte Feld: auslaufend, ohne Gegenstück -->
  <path d="M498 124 C 578 106, 676 112, 748 146" fill="none" stroke="#C9A961" stroke-width="1.3" stroke-dasharray="5 4" opacity="0.9"/>
  <text x="486" y="128" text-anchor="end" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#8A5E3B">kommt bei uns dazu</text>

  <!-- Karten links -->
  <g font-family="Cormorant Garamond, Georgia, serif" font-size="24" fill="#1F1A14" text-anchor="middle">
    <rect x="60" y="150" width="220" height="64" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
    <text x="170" y="190">Ökologie</text>
    <rect x="60" y="280" width="220" height="64" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
    <text x="170" y="320">Ökonomie</text>
    <rect x="60" y="410" width="220" height="64" rx="2" fill="#FAF6EA" stroke="#B8855E" stroke-width="1"/>
    <text x="170" y="450">Demokratie</text>
  </g>

  <!-- Karten rechts -->
  <g font-family="Cormorant Garamond, Georgia, serif" font-size="22" fill="#F4ECD8" text-anchor="middle">
    <rect x="470" y="150" width="165" height="64" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1.2"/>
    <text x="552" y="190">Ökosystem Erde</text>

    <rect x="690" y="150" width="165" height="64" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1.2"/>
    <text x="772" y="179">Frieden und</text>
    <text x="772" y="203">Gewaltfreiheit</text>

    <rect x="470" y="310" width="165" height="64" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1.2"/>
    <text x="552" y="350">Soziale Teilhabe</text>

    <rect x="690" y="310" width="165" height="64" rx="2" fill="#2D4A2B" stroke="#C9A961" stroke-width="1.2"/>
    <text x="772" y="350">Demokratie</text>
  </g>

  <!-- Lesehilfe -->
  <text x="60" y="524" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#1F1A14">Drei Felder benennen wir beide, mit anderen Worten. Frieden und Gewaltfreiheit kommt aus unserer Arbeit dazu.</text>
  <text x="60" y="548" font-family="Inter, system-ui, sans-serif" font-size="14.5" fill="#1F1A14">Keines wird nachhaltig gut, ohne dass die anderen ähnlich gut werden – darum stehen sie im Netz, nicht in einer Liste.</text>
</svg>
